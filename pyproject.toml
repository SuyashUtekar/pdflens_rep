[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdflens-replacement"
version = "0.1.0"
description = "PDFLens-compatible PDF extraction feasibility service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.8,<3",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "pdfplumber>=0.11,<1",
  "htmldocx>=0.0.6,<0.1",
  "ipykernel>=7.4.0",
  "pip>=26.2.2",
  "docling>=2.141.0",
  "docling-core>=2.103.1",
]

[project.optional-dependencies]
docling = ["docling>=2,<3"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
